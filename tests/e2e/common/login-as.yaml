# Subflow: login-as
# Clean login: clearState reinstall (via reconnect-metro) + sign in, then confirm the authed screen.
# clearState is the ROBUST, self-isolating reset — every test starts from a guaranteed-clean slate
# with no cross-test order dependency.
#
# Why not a faster no-clearState + logout approach? Tried and VALIDATED LIVE 2026-06-10: after a
# no-clearState launch the Expo dev-client briefly shows the STALE previous frame while the JS bundle
# reloads, so a visual "am I already logged in?" guard misfires and runs logout on the wrong screen —
# flaky (spurious failures). clearState sidesteps that entirely. And the dominant per-test cost is the
# sim's CPU starvation (~35s of 3–5s-per-command), not the ~6s clearState — see project memory.
#
# Env (REQUIRED, no defaults — every caller must pass them):
#   EMAIL, PASSWORD, ROLE, METRO_HOST, METRO_PORT
#
# DO NOT add an `env:` defaults block here. A subflow's own env defaults OVERRIDE the
# values the caller passes via `runFlow: env:` (verified live 2026-06-11: with defaults
# present, every test logged in as the default member@bubble.test no matter what the
# caller or the qa runner's -e flags specified — bubble-admin tests silently ran as the
# wrong role). With no defaults, a caller that forgets to pass EMAIL types the literal
# string "${EMAIL}" and the login fails loudly.
appId: com.bubble.mobile
---
# Fail fast: catch both a caller that passed nothing (JS-undefined) and a caller that
# forwarded an unset var (the literal string "${EMAIL}" arrives — charAt(0) is '$').
- assertTrue:
    condition: ${typeof EMAIL === 'string' && EMAIL.charAt(0) !== '$' && typeof PASSWORD === 'string' && PASSWORD.charAt(0) !== '$' && typeof METRO_HOST === 'string' && METRO_HOST.charAt(0) !== '$' && typeof METRO_PORT === 'string' && METRO_PORT.charAt(0) !== '$'}
    label: "login-as requires EMAIL, PASSWORD, METRO_HOST, METRO_PORT via runFlow env (no defaults by design)"

- runFlow:
    file: reconnect-metro.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}

# Marker gate: wait until the Welcome screen finished loading the JS bundle (returns the instant
# "Log In" appears; the generous timeout only covers a slow cold bundle). Tap by TEXT — both Welcome
# and Login screens expose a `button-log-in` testID, so id would be ambiguous.
- extendedWaitUntil:
    visible:
      text: "Log In"
    timeout: 30000
- tapOn:
    text: "Log In"

- assertVisible:
    id: input-email
- tapOn:
    id: input-email
- inputText: ${EMAIL}

- tapOn:
    id: input-password
- inputText: ${PASSWORD}

- tapOn:
    id: button-log-in

# iOS "Save Password?" system sheet (can't be pre-granted). Bounded wait, optional dismiss.
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "Not Now"
    optional: true

# Dismiss the campus prompt if it appears.
- tapOn:
    id: button-dismiss-campus-prompt
    optional: true

# Confirm the authenticated session is up (state marker for the post-login Explore load).
- extendedWaitUntil:
    visible:
      id: button-create-fab
    timeout: 30000
