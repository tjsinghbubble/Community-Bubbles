# Subflow: reconnect-metro
# Launches the native dev build from a clean state and reconnects it to Metro.
#
# Why: with the Expo Dev Client, `clearState: true` wipes the stored Metro bundle URL, so the
# app can't find the bundler on next launch. The openLink immediately re-points it. (See
# CLAUDE.md / project memory: this is why a separate native Maestro flow set exists.)
#
# Env (defaults provided; overridable via -e from the qa runner):
#   METRO_HOST, METRO_PORT
appId: com.bubble.mobile
env:
  METRO_HOST: localhost
  METRO_PORT: "8081"
---
- launchApp:
    appId: com.bubble.mobile
    clearState: true
    # clearState wipes permissions every run, so pre-grant here to suppress the first-run
    # "…Would Like to Send You Notifications" system prompt that otherwise blocks the flow.
    permissions:
      notifications: allow

- openLink: "com.bubble.mobile://expo-development-client/?url=http%3A%2F%2F${METRO_HOST}%3A${METRO_PORT}"

# Bounded: the bundle may still be streaming (continuous re-render never "settles", so an uncapped
# wait burns the full 5s default). The next command waits for its own element regardless.
- waitForAnimationToEnd:
    timeout: 2500
