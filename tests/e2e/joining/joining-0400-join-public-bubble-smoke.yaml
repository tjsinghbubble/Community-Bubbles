# qa-id: joining-0400
# qa-reason: Join a public bubble instantly as a member (UC 212)
# Join a public bubble instantly (UC 212).
#
# STATUS: smoke + unverified. Authored against real testIDs but not yet run on a simulator.
# Drop `unverified` after one green run. Signs in as the role-user (member) — NOT the bubble's
# owner — and joins the seeded public "QA Test Bubble".
appId: com.bubble.mobile
tags:
  - joining
  - smoke
  - unverified
  - e2e
  - ios
  - role-user
---
# Fail fast if required env is missing. env: defaults are FORBIDDEN here — file defaults
# OVERRIDE the CLI's -e values in Maestro 2.2.0 (see auth-0100 header / project memory).
- assertTrue:
    condition: ${typeof EMAIL === 'string' && EMAIL.charAt(0) !== '$' && typeof PASSWORD === 'string' && PASSWORD.charAt(0) !== '$' && typeof METRO_HOST === 'string' && METRO_HOST.charAt(0) !== '$' && typeof METRO_PORT === 'string' && METRO_PORT.charAt(0) !== '$' && typeof SHOT_PREFIX === 'string'}
    label: "env guard: required Maestro env must be set (run via `npm run qa`) — otherwise pass -e EMAIL -e PASSWORD -e METRO_HOST=localhost -e METRO_PORT=8081 -e SHOT_PREFIX=tmp/maestro/"

- runFlow:
    file: ../common/login-as.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      ROLE: ${ROLE}
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}

- tapOn:
    id: tab-bubbles
- waitForAnimationToEnd

# Open the seeded public bubble by title — the seed now creates TWO bubbles
# (QA Test Bubble + QA Rules Bubble), so "first card" is no longer deterministic.
- assertVisible:
    id: "card-bubble-.*"
- tapOn: "QA Test Bubble"
- waitForAnimationToEnd
- takeScreenshot: ${SHOT_PREFIX}bubble-details

# Non-members are auto-redirected to the Join screen (button-join-bubble); a member
# would stay on the details screen (button-join-leave toggle). Tap whichever shows.
- tapOn:
    id: button-join-leave
    optional: true
- tapOn:
    id: button-join-bubble
    optional: true
- waitForAnimationToEnd

# For a public bubble the join API call only fires from the welcome modal's "Let's Go"
# (JoinBubbleScreen.handleLetsGo). QA Test Bubble has no rules, so the button is enabled
# immediately. Optional because the details-screen toggle path joins without a modal.
- tapOn:
    id: button-lets-go
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${SHOT_PREFIX}joined

# After joining, the members view becomes available on the details screen.
- assertVisible:
    id: button-view-members
- takeScreenshot: ${SHOT_PREFIX}joined-confirmed
