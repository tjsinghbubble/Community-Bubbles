# Probe subflow for infra-0200 (NOT a test — no qa-id, never discovered by the runner).
# Deliberately declares NO env defaults; records exactly what arrives so the parent can
# assert on it. output.* is shared across the whole flow run.
appId: com.bubble.mobile
---
- evalScript: ${output.probePassthrough = (typeof PROBE === 'undefined') ? '<undefined>' : PROBE}
- evalScript: ${output.probeLiteral = (typeof PROBE_LIT === 'undefined') ? '<undefined>' : PROBE_LIT}
- evalScript: ${output.probeInherited = (typeof CANARY_INHERIT === 'undefined') ? '<undefined>' : CANARY_INHERIT}
