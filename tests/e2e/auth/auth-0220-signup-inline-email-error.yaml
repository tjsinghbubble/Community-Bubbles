# qa-id: auth-0220
# qa-reason: Invalid email shows the inline validation message and correcting it clears it (UI negative for UC 180)
# UI-level error display: the signup form's inline email validation.
#
# STATUS: unverified. Authored against real testIDs/copy but not yet run on a simulator.
# Drop `unverified` after one green run.
#
# SignupScreen sets emailBlurred onBlur; an invalid email then renders the helper text
# "Please enter a valid email address." (and error styling). This flow blurs the field by
# tapping the password input. The short-password error is NOT asserted here: it only
# changes the color of text-password-hint, which Maestro cannot observe — the rejection
# itself is covered headless by auth-0210.
appId: com.bubble.mobile
tags:
  - auth
  - smoke
  - e2e
  - ios
  - role-user
  - unverified
---
# Fail fast if required env is missing. env: defaults are FORBIDDEN here — file defaults
# OVERRIDE the CLI's -e values in Maestro 2.2.0 (see auth-0100 header / project memory).
- assertTrue:
    condition: ${typeof METRO_HOST === 'string' && METRO_HOST.charAt(0) !== '$' && typeof METRO_PORT === 'string' && METRO_PORT.charAt(0) !== '$' && typeof SHOT_PREFIX === 'string'}
    label: "Required env missing — run via `npm run qa`, or pass -e METRO_HOST=localhost -e METRO_PORT=8081 -e SHOT_PREFIX=tmp/maestro/"

- runFlow:
    file: ../common/reconnect-metro.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}

# Welcome → Signup
- tapOn:
    id: button-sign-up
- waitForAnimationToEnd
- assertVisible:
    id: input-email

# Invalid email, then blur by tapping the password field → inline error appears.
- tapOn:
    id: input-email
- inputText: "not-an-email"
- tapOn:
    id: input-password
- assertVisible: "Please enter a valid email address."
- takeScreenshot: ${SHOT_PREFIX}email-error-shown

# Correcting the email clears the error on the next blur.
- tapOn:
    id: input-email
- eraseText: 30
- inputText: "valid-0220@bubble.test"
- tapOn:
    id: input-password
- assertNotVisible: "Please enter a valid email address."
- takeScreenshot: ${SHOT_PREFIX}email-error-cleared
