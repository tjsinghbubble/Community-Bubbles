# qa-id: auth-0800
# qa-reason: Edit profile bio persists to ViewProfileScreen (UC 186)
appId: com.bubble.mobile
tags:
  - auth
  - e2e
  - ios
  - role-user
  - unverified
---
- assertTrue:
    condition: ${typeof EMAIL === 'string' && EMAIL.charAt(0) !== '$' && typeof PASSWORD === 'string' && PASSWORD.charAt(0) !== '$' && typeof METRO_HOST === 'string' && METRO_HOST.charAt(0) !== '$' && typeof METRO_PORT === 'string' && METRO_PORT.charAt(0) !== '$' && typeof SHOT_PREFIX === 'string'}
    label: "Required env missing — run via `npm run qa`, or pass -e EMAIL -e PASSWORD -e METRO_HOST=localhost -e METRO_PORT=8081 -e SHOT_PREFIX=tmp/maestro/"

- runFlow:
    file: ../common/login-as.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      ROLE: ${ROLE}
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}

- takeScreenshot: ${SHOT_PREFIX}01-signed-in

# Navigate to Profile tab
- tapOn:
    text: "Profile"

- waitForAnimationToEnd

- takeScreenshot: ${SHOT_PREFIX}02-profile-tab

# Tap Edit Profile button
- tapOn:
    id: button-edit-profile

- waitForAnimationToEnd

- takeScreenshot: ${SHOT_PREFIX}03-edit-profile-screen

# Expand About section
- tapOn:
    id: button-toggle-about

- waitForAnimationToEnd

- takeScreenshot: ${SHOT_PREFIX}04-about-expanded

# Clear and set bio text
- tapOn:
    id: input-about-me

- clearTextIn:
    id: input-about-me

- typeText: "QA bio ${Date.now()}"

- takeScreenshot: ${SHOT_PREFIX}05-bio-entered

# Save changes
- tapOn:
    id: button-done

- waitForAnimationToEnd

- takeScreenshot: ${SHOT_PREFIX}06-profile-saved

# Assert bio persisted
- assertVisible:
    id: text-my-about
