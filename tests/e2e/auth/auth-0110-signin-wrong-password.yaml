# qa-id: auth-0110
# qa-reason: Wrong password is rejected and never reaches an authed screen (auth-0100 negative)
# Negative variant of auth-0100: a registered email with the WRONG password must be rejected
# and must NOT reach an authenticated screen.
appId: com.bubble.mobile
tags:
  - auth
  - smoke
  - e2e
  - ios
  - role-user
---
# Fail fast if required env is missing. env: defaults are FORBIDDEN here — file defaults
# OVERRIDE the CLI's -e values in Maestro 2.2.0 (see auth-0100 header / project memory).
- assertTrue:
    condition: ${typeof METRO_HOST === 'string' && METRO_HOST.charAt(0) !== '$' && typeof METRO_PORT === 'string' && METRO_PORT.charAt(0) !== '$' && typeof SHOT_PREFIX === 'string'}
    label: "Required env missing — run via `npm run qa`, or pass -e METRO_HOST=localhost -e METRO_PORT=8081 -e SHOT_PREFIX=tmp/maestro/"

- runFlow:
    file: ../common/reconnect-metro.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}

- tapOn:
    text: "Log In"
- waitForAnimationToEnd

- assertVisible:
    id: input-email
- tapOn:
    id: input-email
- inputText: "member@bubble.test"

- tapOn:
    id: input-password
- inputText: "wrong-password-xyz"

- tapOn:
    id: button-log-in
- waitForAnimationToEnd

# Resistance: a wrong password must be REJECTED and must NOT reach an authed screen.
# Positive signal = the native "Login Failed" alert (LoginScreen.tsx fires
# Alert.alert('Login Failed', 'Invalid email or password') in its catch). A native alert is
# reliably in the a11y tree on both platforms, unlike the RN form fields: during the async
# wrong-password round-trip BOTH button-log-in and input-email briefly drop out of the tree
# on Android (proven reproducibly 2026-06-17; the -no-window emulator's screenshots are black
# and uninformative), so gating on either of them flakes. Assert the alert, then confirm the
# authed Explore FAB never appeared.
- extendedWaitUntil:
    visible:
      text: "Login Failed"
    timeout: 10000
- assertNotVisible:
    id: button-create-fab

- takeScreenshot: ${SHOT_PREFIX}signin-rejected
