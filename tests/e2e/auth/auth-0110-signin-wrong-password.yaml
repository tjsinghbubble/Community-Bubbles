# qa-id: auth-0110
# qa-reason: Wrong password is rejected and never reaches an authed screen (auth-0100 negative)
# Negative variant of auth-0100: a registered email with the WRONG password must be rejected
# and must NOT reach an authenticated screen.
appId: com.bubble.mobile
tags:
  - auth
  - smoke
  - e2e
  - ios
  - role-user
---
# Fail fast if required env is missing. env: defaults are FORBIDDEN here — file defaults
# OVERRIDE the CLI's -e values in Maestro 2.2.0 (see auth-0100 header / project memory).
- assertTrue:
    condition: ${typeof METRO_HOST === 'string' && METRO_HOST.charAt(0) !== '$' && typeof METRO_PORT === 'string' && METRO_PORT.charAt(0) !== '$' && typeof SHOT_PREFIX === 'string'}
    label: "Required env missing — run via `npm run qa`, or pass -e METRO_HOST=localhost -e METRO_PORT=8081 -e SHOT_PREFIX=tmp/maestro/"

- runFlow:
    file: ../common/reconnect-metro.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}

- tapOn:
    text: "Log In"
- waitForAnimationToEnd

- assertVisible:
    id: input-email
- tapOn:
    id: input-email
- inputText: "member@bubble.test"

- tapOn:
    id: input-password
- inputText: "wrong-password-xyz"

- tapOn:
    id: button-log-in
- waitForAnimationToEnd

# Resistance: a wrong password must NOT reach an authed screen, and we must still be on the
# login form. Do NOT gate on the submit button re-appearing: during the async wrong-password
# round-trip it is briefly replaced by a loading/error state, and on Android it does not
# reliably return within a few seconds (button-log-in absent from the a11y tree — proven
# reproducibly 2026-06-17; the -no-window emulator's black screenshots are uninformative).
# The meaningful negative-test invariants are: the authed Explore FAB never appears, and the
# login email field is still present (we never left the form).
- assertNotVisible:
    id: button-create-fab
- extendedWaitUntil:
    visible:
      id: input-email
    timeout: 5000

- takeScreenshot: ${SHOT_PREFIX}signin-rejected
