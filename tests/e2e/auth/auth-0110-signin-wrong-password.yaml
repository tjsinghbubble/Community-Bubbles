# qa-id: auth-0110
# Negative variant of auth-0100: a registered email with the WRONG password must be rejected
# and must NOT reach an authenticated screen.
appId: com.bubble.mobile
tags:
  - auth
  - smoke
  - e2e
  - ios
  - role-user
env:
  METRO_HOST: localhost
  METRO_PORT: "8081"
---
- runFlow:
    file: ../common/reconnect-metro.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}

- tapOn:
    text: "Log In"
- waitForAnimationToEnd

- assertVisible:
    id: input-email
- tapOn:
    id: input-email
- inputText: "member@bubble.test"

- tapOn:
    id: input-password
- inputText: "wrong-password-xyz"

- tapOn:
    id: button-log-in
- waitForAnimationToEnd

# Resistance: we must STILL be on the login screen (submit button present) and must NOT have
# reached the authenticated Explore FAB.
- assertVisible:
    id: button-log-in
- assertNotVisible:
    id: button-create-fab

- takeScreenshot: signin-rejected
