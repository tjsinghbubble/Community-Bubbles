# qa-id: auth-0200
# qa-reason: New-user signup through onboarding to an authed session (UC 180)
# Sign up with name, gender, date of birth, email, password (UC 180).
#
# STATUS: unverified. The multi-step signup + onboarding sequence (gender picker, DOB picker,
# interests, guidelines) has NOT yet been verified against a running build, so this flow is
# tagged `unverified` — it is excluded from the default smoke suite and a failure is reported
# as an expected finding, not a regression. Verify interactively, then promote to `smoke`.
#
# The seed truncates the DB before each run, so `signup-0200@bubble.test` is fresh per run.
appId: com.bubble.mobile
tags:
  - auth
  - e2e
  - ios
  - role-user
  - unverified
---
# Fail fast if required env is missing. env: defaults are FORBIDDEN here — file defaults
# OVERRIDE the CLI's -e values in Maestro 2.2.0 (see auth-0100 header / project memory).
- assertTrue:
    condition: ${typeof METRO_HOST === 'string' && METRO_HOST.charAt(0) !== '$' && typeof METRO_PORT === 'string' && METRO_PORT.charAt(0) !== '$' && typeof SHOT_PREFIX === 'string'}
    label: "env guard: required Maestro env must be set (run via `npm run qa`) — otherwise pass -e METRO_HOST=localhost -e METRO_PORT=8081 -e SHOT_PREFIX=tmp/maestro/"

- runFlow:
    file: ../common/reconnect-metro.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}

# Welcome → Signup.
## TLW: Fast-fail if scroll is required to see sign-up button or if button is not attributed
# Wait out the cold JS-bundle pull from Metro after reconnect-metro's clearState relaunch:
# a fresh Android dev-build bundle download + Hermes parse + Fabric mount can exceed
# Maestro's default ~17s assert wait (observed blank screen at 17.2s on a loaded host).
- extendedWaitUntil:
    visible:
      id: button-sign-up
    timeout: 45000
- assertVisible:
    id: button-sign-up
- tapOn:
    id: button-sign-up
- waitForAnimationToEnd
# Signup form transition after tapping sign-up.
- extendedWaitUntil:
    visible:
      id: input-name
    timeout: 15000
- assertVisible:
    id: input-name

- tapOn:
    id: input-name
- inputText: "QA Signup User"

# Gender picker (select the first option).
## TLW: add resiliency with scroll downward
- scrollUntilVisible:
    element:
      id: button-select-gender
- tapOn:
    id: button-select-gender
- tapOn:
    id: "option-gender-.*"
    index: 0
- tapOn:
    id: button-close-gender-picker
    optional: true

# Date-of-birth picker (accept the default and confirm).
## TLW: add resiliency with scroll downward
- scrollUntilVisible:
    element:
      id: button-select-dob
- tapOn:
    id: button-select-dob
- tapOn:
    id: button-confirm-date

## TLW: add resiliency with scroll downward
- scrollUntilVisible:
    element:
      id: input-email
- tapOn:
    id: input-email
- inputText: "signup-0200@bubble.test"
## TLW: add resiliency with scroll downward
- scrollUntilVisible:
    element:
      id: input-password
- tapOn:
    id: input-password
- inputText: "Passw0rd!23"

## TLW: add resiliency with scroll downward
- scrollUntilVisible:
    element:
      id: checkbox-terms
- tapOn:
    id: checkbox-terms

- takeScreenshot: ${SHOT_PREFIX}signup-filled
- tapOn:
    id: button-continue

# Onboarding (interests, then guidelines) — best-effort; optional taps tolerate variation.
- tapOn:
    id: button-continue
    optional: true
- waitForAnimationToEnd

# Success is reaching the authenticated Explore FAB.
## TLW: FIXME is this the right success criteria
# Reaching Explore involves the signup network round-trip + onboarding + navigation.
- extendedWaitUntil:
    visible:
      id: button-create-fab
    timeout: 20000
- assertVisible:
    id: button-create-fab
- takeScreenshot: ${SHOT_PREFIX}signup-complete
