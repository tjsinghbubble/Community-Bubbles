openapi: "3.0.3"

info:
  title: Bubble API
  version: "1.9.2"
  description: |
    REST API for the Bubble community platform. Serves both the React web client
    and the React Native mobile app.

    **Authentication** — most endpoints require a JWT supplied as
    `Authorization: Bearer <token>`. Tokens are issued by `/api/auth/login` and
    `/api/auth/signup`, expire after 7 days, and are invalidated on logout or
    password reset.

    **Rate limits** — auth endpoints are rate-limited (see individual operations).
    Exceeding a limit returns `429 Too Many Requests`.

servers:
  - url: http://api_host:3000
    description: Local development (api_host resolves to 127.0.0.1 via /etc/hosts)
  - url: https://community-bubbles.replit.app
    description: Staging / Replit

security:
  - BearerAuth: []

# ─────────────────────────────────────────────────────────────────────────────
# Reusable components
# ─────────────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ── Common response bodies ──────────────────────────────────────────────────
  responses:
    Success:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    BadRequest:
      description: Validation error or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but insufficient privileges
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ── Schemas ─────────────────────────────────────────────────────────────────
  schemas:

    # Utility
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Unauthorized"

    # ── Core entities ──────────────────────────────────────────────────────────

    User:
      type: object
      description: Authenticated user's own profile
      required: [id, name, email, interests, campusVerified, dismissedCampusPrompt, isSuperAdmin, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        interests:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        campusId:
          type: string
          format: uuid
          nullable: true
        campusEmail:
          type: string
          nullable: true
        campusVerified:
          type: boolean
        dismissedCampusPrompt:
          type: boolean
        isSuperAdmin:
          type: boolean
        profilePhoto:
          type: string
          nullable: true
        aboutMe:
          type: string
          maxLength: 500
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserPublicProfile:
      type: object
      description: Public profile visible to other users
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        profilePhoto:
          type: string
          nullable: true
        aboutMe:
          type: string
          nullable: true
        interests:
          type: array
          items:
            type: string
        sharedBubbles:
          type: array
          items:
            $ref: '#/components/schemas/BubbleSummary'

    Campus:
      type: object
      required: [id, domain, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
          example: "state.edu"
        title:
          type: string
          example: "State University"
        createdAt:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, name, displayOrder]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100
        displayName:
          type: string
          nullable: true
        header:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        parentId:
          type: integer
          nullable: true
        displayOrder:
          type: integer
        placeholderName:
          type: string
          nullable: true
        placeholderTagline:
          type: string
          nullable: true
        placeholderDescription:
          type: string
          nullable: true

    CategoryPlaceholder:
      type: object
      required: [id, categoryId, fieldType, value, displayOrder]
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        fieldType:
          type: string
        value:
          type: string
        displayOrder:
          type: integer

    BubbleSummary:
      type: object
      required: [id, title, tagline, privacy, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tagline:
          type: string
        coverImage:
          type: string
          nullable: true
        privacy:
          type: string
          enum: [Public, Private, Request]
        status:
          type: string
          enum: [pending, approved, rejected]
        members:
          type: integer

    Bubble:
      type: object
      required: [id, title, tagline, category, description, privacy, members, status, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 150
        tagline:
          type: string
          maxLength: 150
        category:
          type: string
        categoryId:
          type: integer
          nullable: true
        description:
          type: string
          maxLength: 2000
        rules:
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 20
        privacy:
          type: string
          enum: [Public, Private, Request]
        coverImage:
          type: string
          nullable: true
        images:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            type: string
        members:
          type: integer
        memberLimit:
          type: integer
          nullable: true
        distance:
          type: string
          nullable: true
        locationName:
          type: string
          maxLength: 300
          nullable: true
        locationAddress:
          type: string
          maxLength: 300
          nullable: true
        locationLat:
          type: string
          nullable: true
        locationLng:
          type: string
          nullable: true
        radiusMiles:
          type: integer
          nullable: true
        createdBy:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: string
          nullable: true
        shortId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    InsertBubble:
      type: object
      required: [title, tagline, category, description, privacy, createdBy]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        tagline:
          type: string
          minLength: 1
          maxLength: 150
        category:
          type: string
        categoryId:
          type: integer
          nullable: true
        description:
          type: string
          minLength: 1
          maxLength: 2000
        rules:
          type: array
          items:
            type: string
            maxLength: 300
          maxItems: 20
          default: []
        privacy:
          type: string
          enum: [Public, Private, Request]
          default: Public
        coverImage:
          type: string
          nullable: true
        images:
          type: array
          items:
            type: string
          default: []
        memberLimit:
          type: integer
          nullable: true
        locationName:
          type: string
          maxLength: 300
          nullable: true
        locationAddress:
          type: string
          maxLength: 300
          nullable: true
        locationLat:
          type: string
          nullable: true
        locationLng:
          type: string
          nullable: true
        radiusMiles:
          type: integer
          nullable: true
        createdBy:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, approved]
          default: pending

    Membership:
      type: object
      required: [id, userId, bubbleId, role, membershipStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        bubbleId:
          type: string
          format: uuid
        role:
          type: string
          enum: [member, admin]
        membershipStatus:
          type: string
          enum: [approved, pending, waitlisted, on_hold]
        createdAt:
          type: string
          format: date-time

    Event:
      type: object
      required: [id, title, date, startTime, timezone, visibility, bubbleId, createdBy, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 2000
          nullable: true
        coverImage:
          type: string
          nullable: true
        images:
          type: array
          items:
            type: string
        date:
          type: string
          format: date
          description: YYYY-MM-DD in UTC
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: HH:MM in UTC
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          nullable: true
        timezone:
          type: string
          example: "America/Chicago"
          description: IANA timezone identifier
        locationName:
          type: string
          maxLength: 300
          nullable: true
        locationAddress:
          type: string
          nullable: true
        locationLat:
          type: string
          nullable: true
        locationLng:
          type: string
          nullable: true
        locationTbd:
          type: boolean
        visibility:
          type: string
          enum: [public, request, private]
        petFriendly:
          type: boolean
        smokeFree:
          type: boolean
        wheelchairAccessible:
          type: boolean
        attendeeLimit:
          type: integer
          nullable: true
        rsvpDeadline:
          type: string
          nullable: true
        recurrenceType:
          type: string
          enum: [never, daily, weekly, biweekly, monthly, yearly, custom]
        recurrenceCustomFrequency:
          type: string
          nullable: true
        recurrenceCustomInterval:
          type: integer
          nullable: true
        bubbleId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: string
          nullable: true
        shortId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    InsertEvent:
      type: object
      required: [title, date, startTime, timezone, visibility, bubbleId, createdBy]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 2000
          nullable: true
        coverImage:
          type: string
          nullable: true
        images:
          type: array
          items:
            type: string
          default: []
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        endTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          nullable: true
        timezone:
          type: string
          example: "America/Chicago"
        locationName:
          type: string
          maxLength: 300
          nullable: true
        locationAddress:
          type: string
          nullable: true
        locationLat:
          type: string
          nullable: true
        locationLng:
          type: string
          nullable: true
        locationTbd:
          type: boolean
          default: false
        visibility:
          type: string
          enum: [public, request, private]
          default: public
        petFriendly:
          type: boolean
          default: false
        smokeFree:
          type: boolean
          default: false
        wheelchairAccessible:
          type: boolean
          default: false
        attendeeLimit:
          type: integer
          nullable: true
        rsvpDeadline:
          type: string
          nullable: true
        recurrenceType:
          type: string
          enum: [never, daily, weekly, biweekly, monthly, yearly, custom]
          default: never
        recurrenceCustomFrequency:
          type: string
          nullable: true
        recurrenceCustomInterval:
          type: integer
          nullable: true
        bubbleId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        campusId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, approved]
          default: approved

    EventAttendee:
      type: object
      required: [id, eventId, userId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [going, interested, requested, waitlisted]
        createdAt:
          type: string
          format: date-time

    EventSignupTask:
      type: object
      required: [id, eventId, title, icon, createdBy, createdAt, position]
      properties:
        id:
          type: integer
        eventId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 500
          nullable: true
        icon:
          type: string
          default: "📋"
        spotsNeeded:
          type: integer
          minimum: 1
          maximum: 999
          nullable: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        position:
          type: integer

    Notification:
      type: object
      required: [id, recipientId, type, title, body, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        body:
          type: string
        metadata:
          type: string
          description: JSON string with additional context
          nullable: true
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationPreferences:
      type: object
      required: [userId, pushPaused, bubbleActivity, eventActivity, eventReminders, taskReminders, waitlistUpdates, announcements]
      properties:
        userId:
          type: string
          format: uuid
        pushPaused:
          type: boolean
        bubbleActivity:
          type: boolean
        eventActivity:
          type: boolean
        eventReminders:
          type: boolean
        taskReminders:
          type: boolean
        waitlistUpdates:
          type: boolean
        announcements:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    Report:
      type: object
      required: [id, reportType, reason, reporterUserId, bubbleId, visibleTo, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reportType:
          type: string
        reason:
          type: string
          maxLength: 500
        freeText:
          type: string
          maxLength: 2000
          nullable: true
        reporterUserId:
          type: string
          format: uuid
        reportedUserId:
          type: string
          format: uuid
          nullable: true
        bubbleId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
          nullable: true
        visibleTo:
          type: string
          enum: [superadmin, bubble_admin]
        status:
          type: string
          enum: [pending, reviewed, resolved, dismissed]
        createdAt:
          type: string
          format: date-time

    BulletinPostType:
      type: object
      required: [id, name, displayName, color, adminOnly, displayOrder]
      properties:
        id:
          type: integer
        name:
          type: string
        displayName:
          type: string
        color:
          type: string
        adminOnly:
          type: boolean
        displayOrder:
          type: integer

    BulletinPost:
      type: object
      required: [id, boardId, postTypeId, authorId, title, body, isPinned, createdAt]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        postTypeId:
          type: integer
        authorId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 150
        body:
          type: string
          maxLength: 5000
        imageUrl:
          type: string
          nullable: true
        isPinned:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BulletinReply:
      type: object
      required: [id, postId, authorId, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Rule:
      type: object
      required: [id, text, name, description, createdAt]
      properties:
        id:
          type: integer
        text:
          type: string
        name:
          type: string
        description:
          type: string
        position:
          type: integer
        createdAt:
          type: string
          format: date-time

    CrashReport:
      type: object
      required: [id, message, isFatal, createdAt]
      properties:
        id:
          type: integer
        message:
          type: string
        stack:
          type: string
          nullable: true
        context:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
        appVersion:
          type: string
          nullable: true
        isFatal:
          type: boolean
        userId:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AuditLog:
      type: object
      required: [id, action, adminId, targetId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        adminId:
          type: string
          format: uuid
        targetId:
          type: string
        ip:
          type: string
          nullable: true
        extra:
          type: string
          description: JSON string with additional context
          nullable: true
        createdAt:
          type: string
          format: date-time

    ErrorLog:
      type: object
      required: [id, message, timestamp, platform, level]
      properties:
        id:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        platform:
          type: string
        level:
          type: string

    UserSession:
      type: object
      required: [id, userId, startedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: integer
          nullable: true

    SlowCall:
      type: object
      required: [id, endpoint, method, durationMs, createdAt]
      properties:
        id:
          type: integer
        endpoint:
          type: string
        method:
          type: string
        durationMs:
          type: integer
        createdAt:
          type: string
          format: date-time

    LatencyMetric:
      type: object
      required: [method, endpoint, count, p50Ms, p95Ms, p99Ms, avgMs, maxMs]
      properties:
        method:
          type: string
        endpoint:
          type: string
        count:
          type: integer
        p50Ms:
          type: integer
        p95Ms:
          type: integer
        p99Ms:
          type: integer
        avgMs:
          type: integer
        maxMs:
          type: integer
        errorRate:
          type: integer

    AuthTokenResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT bearer token, valid for 7 days

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────────────────────────────────────

  /api/v1/ping:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: pong
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /api/v1/version:
    get:
      tags: [Health]
      summary: Application version
      security: []
      responses:
        '200':
          description: Current semver
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    example: "1.9.2"

  /api/v1/status:
    get:
      tags: [Health]
      summary: Operational status
      security: []
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptime, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok, maintenance]
                  version:
                    type: string
                  uptime:
                    type: number
                    description: Process uptime in seconds
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/health:
    get:
      tags: [Health]
      summary: Deep health check (DB + third-party services)
      security: []
      responses:
        '200':
          description: All services healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  services:
                    type: object
                    properties:
                      db:
                        type: string
                        enum: [ok, error]
                      storage:
                        type: string
                        enum: [ok, error]
                      third-party-auth:
                        type: string
                        enum: [ok, error]

  # ── Authentication ─────────────────────────────────────────────────────────

  /api/auth/send-verification:
    post:
      tags: [Auth]
      summary: Send email verification code
      description: Rate-limited to 5 requests per 60 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Code sent (or fallback provided in dev)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  emailFailed:
                    type: boolean
                  fallbackCode:
                    type: string
                    description: Only present when email delivery failed
                  devCode:
                    type: string
                    description: Only present in development environment
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/verify-code:
    post:
      tags: [Auth]
      summary: Verify email verification code
      description: Rate-limited to 10 requests per 15 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        '200':
          description: Code verified
          content:
            application/json:
              schema:
                type: object
                required: [success, verified]
                properties:
                  success:
                    type: boolean
                  verified:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new account
      description: Rate-limited to 5 requests per 60 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 1000
                interests:
                  type: array
                  items:
                    type: string
                    maxLength: 50
                  maxItems: 20
                  default: []
                aboutMe:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive JWT
      description: |
        Rate-limited to 10 attempts per 15 minutes per IP.
        Account is locked after 5 consecutive failures.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate all tokens for the current user
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset code by email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (response is always success to avoid enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'

