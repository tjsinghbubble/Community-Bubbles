                  type: string
                  maxLength: 2000
                  nullable: true
                reporterUserId:
                  type: string
                  format: uuid
                reportedUserId:
                  type: string
                  format: uuid
                  nullable: true
                bubbleId:
                  type: string
                  format: uuid
                eventId:
                  type: string
                  format: uuid
                  nullable: true
                visibleTo:
                  type: string
                  enum: [superadmin, bubble_admin]
                  default: superadmin
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

